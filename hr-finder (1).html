<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인사정보 바로가기</title>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<script id="qrlib" src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="app-style">
/* Layout: single narrow column (phone-first, opened from a QR), question box on top, result card below, settings as a second tab */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#1b2430; --muted:#5d6878; --line:#dde2ea;
  --accent:#2c56c9; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --font-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1b2129; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2c3440;
  --accent:#7c9cf2; --accent-ink:#0f1420; --accent-soft:#232d45;
  --ok:#6fcf9b; --ok-soft:#1c3328; --warn:#e8bf5a; --warn-soft:#3a3020; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b2129; --ink:#e7ebf1; --muted:#9aa5b4; --line:#2c3440;
  --accent:#7c9cf2; --accent-ink:#0f1420; --accent-soft:#232d45;
  --ok:#6fcf9b; --ok-soft:#1c3328; --warn:#e8bf5a; --warn-soft:#3a3020; color-scheme:dark }
html,body{background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.9rem}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;font-weight:500;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ask{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ask label{font-weight:600;font-size:.95rem}
.row{display:flex;gap:8px}
input[type=text],input[type=url],textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{font-family:var(--font-mono);font-size:.8rem;min-height:120px}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.8rem;font-weight:500;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--accent)}

.result{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.best{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.status{display:inline-flex;align-self:flex-start;font-size:.75rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.card h2{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.9rem}
.url{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);word-break:break-all}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
.cand:hover{border-color:var(--accent)}
.cand .k{font-size:.75rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}
.hit{font-family:var(--font-mono);font-size:.75rem;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px}

/* settings */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:1rem}
.sec .hint{font-size:.82rem;color:var(--muted);margin:0}
.entry{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.entry > div{min-width:0}
.entry strong{font-size:.95rem}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kw span{font-size:.72rem;font-family:var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.acts{display:flex;gap:4px}
.form{display:flex;flex-direction:column;gap:8px}
.form small{color:var(--muted);font-size:.78rem}
#qr{align-self:flex-start;background:#fff;padding:12px;border-radius:8px}
#qr:empty{display:none}
.faq{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.faq h2{margin:0;font-size:1rem;font-weight:600}
.faq ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.faq li + li{border-top:1px solid var(--line)}
.faq-item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:transparent;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.faq-item:hover{background:var(--bg)}
.rank{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}
.faq li:first-child .rank{background:var(--accent);color:var(--accent-ink)}
.fq{flex:1;min-width:0;display:flex;flex-direction:column}
.fq span:first-child{font-size:.93rem}
.fa{font-size:.75rem;color:var(--muted)}
.go{color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:16px}
.stats:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.tile b{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.75rem;color:var(--muted)}
.tile.warn b{color:var(--warn)}
.stat-h{font-size:.85rem;font-weight:600;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bars{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.85rem}
.bars li > span:first-child{min-width:0;overflow-wrap:anywhere}
.bars .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.bars .bar{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bars.other .bar i{background:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem}
.example{font-size:.75rem;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px}
@media (prefers-reduced-motion: no-preference){ .card{transition:box-shadow .2s} }

.admin-badge{font-size:.72rem;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:999px;align-self:flex-start}
.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dirty{font-size:.8rem;color:var(--warn)}
</style>
</head>
<body>
<div id="mount"></div>
<template id="shell"><div class="wrap">
  <header>
    <div>
      <h1>인사정보 바로가기</h1>
      <p class="sub">궁금한 내용을 적으면 맞는 페이지로 안내해요</p>
    </div>
    <div class="tabs" role="tablist" id="tabs" hidden="">
      <button role="tab" id="tab-find" aria-selected="true">찾기</button>
      <button role="tab" id="tab-set" aria-selected="false">설정</button>
    </div>
  </header>

  <form class="card sec" id="pinCard" hidden="">
    <h3>관리자 확인</h3>
    <p class="hint">관리자 PIN을 입력하면 설정 화면이 열려요.</p>
    <div class="row">
      <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <button class="btn primary" type="submit">확인</button>
    </div>
  </form>
  <!-- 찾기 -->
  <section id="view-find" class="wrap" style="gap:16px">
    <form class="ask" id="askForm">
      <label for="q">무엇을 찾고 계세요?</label>
      <div class="row">
        <input type="text" id="q" placeholder="예: 연차 몇 개 남았는지" autocomplete="off">
        <button class="btn primary" type="submit">찾기</button>
      </div>
      <p class="note" id="logNote" hidden="" style="margin:0">입력한 질문은 서비스 개선을 위해 익명으로 수집돼요. 이름이나 사번은 적지 마세요.</p>
    </form>
    <div class="result" id="result" aria-live="polite"></div>
    <section class="faq" id="faqBox" aria-labelledby="faqTitle">
      <h2 id="faqTitle">자주 묻는 질문 TOP 5</h2>
      <ol id="faq"></ol>
    </section>
  </section>

  <!-- 설정 -->
  <section id="view-set" class="wrap" style="gap:24px" hidden="">
    <span class="admin-badge">관리자 화면</span>
    <div class="card savebar"><button class="btn primary" type="button" id="publishBtn">배포용 파일 저장</button><span class="dirty" id="dirtyNote" hidden="">배포 파일에 아직 반영 안 된 수정이 있어요</span><p class="hint" style="flex-basis:100%;margin:0">수정을 마치면 이 버튼으로 새 파일을 받아 서버의 기존 파일과 바꿔 주세요. 그 전까지 수정 내용은 이 브라우저에만 임시 저장돼요.</p></div>
    <p class="example" id="exampleNote">지금 들어 있는 링크는 예시 주소(hr.example.com)예요. 실제 인사정보 사이트 주소로 바꿔서 쓰세요.</p>

    <div class="card sec">
      <h3>검색 주소</h3>
      <p class="hint">매칭되는 페이지가 없을 때 이 주소로 검색해요. 검색어 자리에 <span class="hit">{q}</span>를 넣어 주세요. 사이트에서 아무 단어나 검색한 뒤 주소창을 복사하면 형식을 알 수 있어요.</p>
      <input type="url" id="searchUrl" placeholder="https://hr.example.com/search?keyword={q}">
      <button class="btn small" id="saveSearch" type="button" style="align-self:flex-start">저장</button>
    </div>

    <div class="card sec">
      <h3>바로가기 목록</h3>
      <p class="hint">키워드가 질문에 많이 들어 있을수록 그 페이지가 먼저 나와요. 직원들이 실제로 쓰는 말(월차, 반차, 명세서)을 키워드로 넣으면 정확도가 올라가요.</p>
      <div class="cands" id="entries"></div>
      <form class="form" id="entryForm">
        <input type="hidden" id="editId">
        <input type="text" id="fTitle" placeholder="이름 (예: 연차 조회)" required="">
        <input type="url" id="fUrl" placeholder="페이지 주소 https://..." required="">
        <input type="text" id="fKw" placeholder="키워드, 쉼표로 구분 (예: 연차, 휴가, 월차)" required="">
        <input type="text" id="fDesc" placeholder="한 줄 설명 (선택)">
        <div class="row">
          <button class="btn primary small" type="submit" id="fSubmit">추가</button>
          <button class="btn small" type="button" id="fCancel" hidden="">취소</button>
        </div>
      </form>
    </div>

    <div class="card sec">
      <h3>인사팀 문의 양식 (Microsoft Forms)</h3>
      <p class="hint">맞는 페이지를 못 찾았을 때 "인사팀에 질문 남기기" 버튼이 나와요. Forms에서 '미리 채워진 URL 가져오기'로 질문 칸에 <span class="hit">QUESTION</span>이라고 적어서 만든 링크를 붙여 넣으세요.</p>
      <div class="row">
        <input type="url" id="formsUrl" placeholder="https://forms.office.com/…QUESTION…">
        <button class="btn small" type="button" id="saveForms">저장</button>
      </div>
      <button class="btn small" type="button" id="testForms" style="align-self:flex-start">테스트로 열어보기</button>
      <div id="testFormsOut"></div>
    </div>

    <div class="card sec">
      <h3>질문 기록 · 문의 건수 (구글 시트, 선택)</h3>
      <p class="hint">구글 시트 Apps Script의 웹 앱 주소(…/exec)를 넣으면 직원 질문이 시트에 쌓여요. 주소는 배포용 파일에 함께 저장돼요.</p>
      <div class="row">
        <input type="url" id="logUrl" placeholder="https://script.google.com/macros/s/…/exec">
        <button class="btn small" type="button" id="saveLog">저장</button>
      </div>
      <p class="hint">통계 키는 Apps Script의 ADMIN_KEY와 같은 값이에요. 이 브라우저에만 기억되고 배포 파일에는 들어가지 않아요.</p>
      <div class="row" style="flex-wrap:wrap">
        <input type="password" id="statsKey" autocomplete="off" placeholder="통계 키" style="flex:1 1 140px">
        <select id="statsDays" aria-label="기간" style="font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px">
          <option value="0">전체 기간</option><option value="30">최근 30일</option><option value="7">최근 7일</option>
        </select>
        <button class="btn small primary" type="button" id="loadStats">통계 불러오기</button>
      </div>
      <div id="stats" class="stats"></div>
    </div>

    <div class="card sec">
      <h3>자주 묻는 질문 TOP 5</h3>
      <p class="hint">한 줄에 질문 하나씩, 위에서부터 1위예요. 직원이 누르면 그 질문으로 바로 찾아줘요. 바로가기 키워드가 들어간 질문이어야 맞는 페이지가 나와요.</p>
      <textarea id="faqEdit" rows="5" style="font-family:var(--font-body);font-size:.9rem;min-height:0"></textarea>
      <button class="btn small" type="button" id="saveFaq" style="align-self:flex-start">저장</button>
    </div>

    <div class="card sec">
      <h3>관리자 PIN 바꾸기</h3>
      <p class="hint">처음 PIN은 0000이에요. 바꾼 PIN은 배포용 파일에 저장돼요.</p>
      <div class="row">
        <input type="text" id="newPin" inputmode="numeric" autocomplete="off" placeholder="새 PIN (4자리 이상)">
        <button class="btn small" type="button" id="savePin">변경</button>
      </div>
    </div>

    <div class="card sec">
      <h3>QR 코드 만들기</h3>
      <p class="hint">이 페이지를 올린 주소(#admin 없이)를 붙여 넣으면 QR이 만들어져요. 화면을 캡처해서 게시물에 쓰면 돼요.</p>
      <div class="row">
        <input type="url" id="qrUrl" placeholder="https://...">
        <button class="btn small" type="button" id="makeQr">만들기</button>
      </div>
      <div id="qr"></div>
    </div>

    <div class="card sec">
      <h3>백업 · 옮기기</h3>
      <p class="hint">현재 설정을 텍스트로 복사해 보관하거나, 보관해 둔 내용을 붙여 넣어 되돌릴 수 있어요.</p>
      <textarea id="backup" aria-label="설정 데이터"></textarea>
      <div class="row">
        <button class="btn small" type="button" id="copyBk">복사</button>
        <button class="btn small" type="button" id="loadBk">붙여 넣은 내용 적용</button>
        <button class="btn small" type="button" id="resetBk">예시로 초기화</button>
      </div>
    </div>
  </section>
</div></template>

      {id:"e4", title:"증명서 발급", url:"https://hr.example.com/certificate", desc:"재직·경력증명서 출력", kw:["증명서","재직증명서","경력증명서","재직","발급","원천징수"]},
      {id:"e5", title:"근무 스케줄", url:"https://hr.example.com/schedule", desc:"이번 주·다음 주 근무표", kw:["스케줄","근무표","근무","시프트","교대","출근","휴무"]},
      {id:"e6", title:"출퇴근 기록", url:"https://hr.example.com/attendance", desc:"출퇴근 체크 기록과 수정 요청", kw:["출퇴근","출근기록","퇴근","지각","근태","타각","기록수정"]},
      {id:"e7", title:"복리후생 안내", url:"https://hr.example.com/benefit", desc:"직원 할인, 건강검진, 지원 제도", kw:["복리후생","복지","할인","건강검진","검진","지원금","직원할인"]},
      {id:"e8", title:"육아휴직·출산휴가", url:"https://hr.example.com/leave/parental", desc:"육아휴직, 출산전후휴가, 배우자 출산휴가", kw:["육아휴직","출산휴가","육아","출산","배우자출산","임신","육아기단축"]}
    ]
  };

  const $ = s => document.querySelector(s);
  let state = load();

  // 설정은 페이지 안에 들어 있어요(#cfg). 관리자가 "반영"을 누르면 페이지 새 버전으로 저장돼 모두에게 보여요.
  function load(){
    try{ const el = document.getElementById("cfg"); const d = el && JSON.parse(el.textContent); if(d && Array.isArray(d.entries)) return d; }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
  let dirty = false;
  let save = function(){ dirty = true; renderAll(); };

  // ---- matching ----
  const norm = s => (s||"").toLowerCase().replace(/[\s\.\,\?\!~·\-_/]/g,"");
  function score(entry, q){
    const nq = norm(q); let s = 0; const hits = [];
    if(!nq) return {s:0,hits};
    for(const k of entry.kw){
      const nk = norm(k); if(!nk) continue;
      if(nq.includes(nk)){ s += 1 + nk.length*0.5; hits.push(k); }
      else if(nq.length>=2 && nk.includes(nq)){ s += 0.8; hits.push(k); }
    }
    const nt = norm(entry.title);
    if(nq.includes(nt)) s += 2;
    return {s, hits};
  }
  function find(q){
    return state.entries.map(e => ({e, ...score(e,q)})).filter(r => r.s>0).sort((a,b)=>b.s-a.s);
  }
  function searchLink(q){
    const base = state.searchUrl || "";
    if(!base.includes("{q}")) return null;
    return base.replace("{q}", encodeURIComponent(q.trim()));
  }

  // ---- render: find ----
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function link(url, text, cls){ return `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`; }

  // Microsoft Forms 미리 채우기 링크: 질문 자리 표시(QUESTION 또는 {q})를 실제 질문으로 바꿔요
  function formsLink(q){
    const u = state.formsUrl || "";
    if(!u) return null;
    const v = encodeURIComponent(q.trim());
    const out = u.replace(/QUESTION|%7Bq%7D|\{q\}/gi, v);
    return out === u ? null : out;
  }
  function formsBtn(q){
    const f = formsLink(q);
    return f ? `<a class="btn" href="${esc(f)}" target="_blank" rel="noopener" data-log="forms">인사팀에 질문 남기기 ↗</a><span class="note">질문이 미리 채워진 문의 양식이 열려요. 제출을 눌러야 접수돼요.</span>` : "";
  }

  function show(q){
    const box = $("#result");
    if(!q.trim()){ box.innerHTML = ""; return; }
    const res = find(q);
    const sl = searchLink(q);
    const searchCard = sl
      ? `<div class="card"><span class="status warn">${res.length? "원하는 게 없나요?" : "맞는 페이지를 못 찾았어요"}</span>
           <p>인사정보 사이트에서 <strong>“${esc(q.trim())}”</strong>로 바로 검색할 수 있어요.</p>
           <a class="btn" href="${esc(sl)}" target="_blank" rel="noopener" data-log="site">사이트에서 검색하기 ↗</a>${formsBtn(q)}</div>`
      : (formsLink(q) ? `<div class="card"><span class="status warn">${res.length? "원하는 게 없나요?" : "맞는 페이지를 못 찾았어요"}</span><p>인사팀에 질문을 남겨 주시면 확인할게요.</p>${formsBtn(q)}</div>`
         : `<div class="card"><span class="status warn">검색 주소가 없어요</span><p>설정 탭에서 인사정보 사이트의 검색 주소를 넣어 주세요.</p></div>`);

    if(!res.length){ box.innerHTML = searchCard; return; }

    const top = res[0], second = res[1];
    const confident = top.s >= 2 && (!second || top.s >= second.s*1.4);
    let html = `<div class="card best">
      <span class="status ${confident?"ok":"warn"}">${confident? "가장 잘 맞는 페이지" : "이 페이지일 가능성이 높아요"}</span>
      <h2>${esc(top.e.title)}</h2>
      ${top.e.desc? `<p>${esc(top.e.desc)}</p>`:""}
      <div class="chips">${top.hits.map(h=>`<span class="hit">${esc(h)}</span>`).join("")}</div>
      <a class="btn primary" href="${esc(top.e.url)}" target="_blank" rel="noopener" data-log="open" data-page="${esc(top.e.title)}">바로 열기 ↗</a>
      <span class="url">${esc(top.e.url)}</span>
    </div>`;
    const rest = res.slice(1,4);
    if(rest.length){
      html += `<div class="cands"><span class="note">다른 후보</span>${rest.map(r=>
        `<a class="cand" href="${esc(r.e.url)}" target="_blank" rel="noopener" data-log="open" data-page="${esc(r.e.title)}"><span>${esc(r.e.title)}</span><span class="k">${r.hits.slice(0,3).map(esc).join(" · ")} ↗</span></a>`).join("")}</div>`;
    }
    html += searchCard;
    box.innerHTML = html;
  }

  function renderQuick(){
    const list = (state.quick||[]).slice(0,5);
    $("#faqBox").hidden = !list.length;
    $("#faq").innerHTML = list.map((t,i)=>{
      const top = find(t)[0];
      return `<li><button type="button" class="faq-item" data-q="${esc(t)}"><span class="rank">${i+1}</span><span class="fq"><span>${esc(t)}</span>${top?`<span class="fa">${esc(top.e.title)}</span>`:""}</span><span class="go" aria-hidden="true">→</span></button></li>`;
    }).join("");
    $("#faq").querySelectorAll(".faq-item").forEach(b=>b.onclick=()=>{
      const t=b.dataset.q; $("#q").value=t; show(t); logSearch(t);
      $("#askForm").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
    });
    const fe=$("#faqEdit"); if(fe && document.activeElement!==fe) fe.value=(state.quick||[]).join("\n");
  }

  // ---- render: settings ----
  function renderEntries(){
    const el = $("#entries");
    el.innerHTML = state.entries.map(e=>`<div class="entry" data-id="${e.id}">
      <div><strong>${esc(e.title)}</strong><div class="url">${esc(e.url)}</div><div class="kw">${e.kw.map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>
      <div class="acts"><button class="btn small" data-a="edit" type="button">수정</button><button class="btn small" data-a="del" type="button">삭제</button></div>
    </div>`).join("") || `<p class="hint">아직 바로가기가 없어요. 아래에서 첫 페이지를 추가해 보세요.</p>`;
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const id = b.closest(".entry").dataset.id, e = state.entries.find(x=>x.id===id);
      if(b.dataset.a==="del"){
        if(b.dataset.confirm){ state.entries = state.entries.filter(x=>x.id!==id); save(); toast("삭제했어요"); }
        else { b.dataset.confirm="1"; b.textContent="한 번 더 누르면 삭제"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent="삭제"; } },3000); }
      } else {
        $("#editId").value=id; $("#fTitle").value=e.title; $("#fUrl").value=e.url; $("#fKw").value=e.kw.join(", "); $("#fDesc").value=e.desc||"";
        $("#fSubmit").textContent="수정 저장"; $("#fCancel").hidden=false; $("#fTitle").focus();
      }
    });
  }
  function resetForm(){ $("#entryForm").reset(); $("#editId").value=""; $("#fSubmit").textContent="추가"; $("#fCancel").hidden=true; }
  function renderAll(){
    renderQuick(); renderEntries();
    $("#searchUrl").value = state.searchUrl||"";
    $("#backup").value = JSON.stringify(state, null, 1);
    $("#exampleNote").hidden = !JSON.stringify(state).includes("hr.example.com");
    $("#logNote").hidden = !state.logUrl;
    if(document.activeElement !== $("#logUrl")) $("#logUrl").value = state.logUrl || "";
    if(document.activeElement !== $("#formsUrl")) $("#formsUrl").value = state.formsUrl || "";
    $("#dirtyNote").hidden = !dirty;
  }

  let tt; function toast(m){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1800); }

  // ---- events ----
  $("#askForm").addEventListener("submit", ev=>{ ev.preventDefault(); show($("#q").value); logSearch($("#q").value); });
  let deb; $("#q").addEventListener("input", ()=>{ clearTimeout(deb); deb=setTimeout(()=>show($("#q").value),250); });

  function tab(which){
    const f = which==="find";
    $("#tab-find").setAttribute("aria-selected", f); $("#tab-set").setAttribute("aria-selected", !f);
    $("#view-find").hidden = !f; $("#view-set").hidden = f;
  }
  $("#tab-find").onclick=()=>tab("find"); $("#tab-set").onclick=()=>tab("set");

  $("#saveSearch").onclick=()=>{
    const v=$("#searchUrl").value.trim();
    if(v && !v.includes("{q}")){ toast("검색어 자리에 {q}를 넣어 주세요"); return; }
    state.searchUrl=v; save(); toast("검색 주소를 저장했어요");
  };
  $("#entryForm").addEventListener("submit", ev=>{
    ev.preventDefault();
    const kw = $("#fKw").value.split(",").map(s=>s.trim()).filter(Boolean);
    const data = {title:$("#fTitle").value.trim(), url:$("#fUrl").value.trim(), kw, desc:$("#fDesc").value.trim()};
    const id = $("#editId").value;
    if(id){ Object.assign(state.entries.find(x=>x.id===id), data); toast("수정했어요"); }
    else { state.entries.push({id:"e"+Date.now(), ...data}); toast("추가했어요"); }
    resetForm(); save();
  });
  $("#fCancel").onclick=resetForm;

  $("#makeQr").onclick=()=>{
    const u=$("#qrUrl").value.trim(), box=$("#qr"); box.innerHTML="";
    if(!u){ toast("링크를 먼저 붙여 넣어 주세요"); return; }
    if(typeof QRCode==="undefined"){ toast("QR 도구를 불러오지 못했어요. 새로고침해 주세요"); return; }
    new QRCode(box,{text:u,width:200,height:200,colorDark:"#1b2430",colorLight:"#ffffff"});
  };
  $("#copyBk").onclick=()=>{
    const t=$("#backup");
    navigator.clipboard?.writeText(t.value).then(()=>toast("복사했어요")).catch(()=>{ t.select(); toast("선택됐어요. Ctrl+C로 복사하세요"); })
      ?? (t.select(), toast("선택됐어요. Ctrl+C로 복사하세요"));
  };
  $("#loadBk").onclick=()=>{
    try{ const d=JSON.parse($("#backup").value); if(!Array.isArray(d.entries)) throw 0; state=d; state.quick=state.quick||[]; save(); toast("적용했어요"); }
    catch(e){ toast("형식이 맞지 않아요. 복사한 내용을 그대로 붙여 넣어 주세요"); }
  };
  $("#resetBk").onclick=function(){
    if(this.dataset.confirm){ state=JSON.parse(JSON.stringify(DEFAULTS)); save(); toast("예시로 되돌렸어요"); delete this.dataset.confirm; this.textContent="예시로 초기화"; }
    else { this.dataset.confirm="1"; this.textContent="한 번 더 누르면 초기화"; setTimeout(()=>{ delete this.dataset.confirm; this.textContent="예시로 초기화"; },3000); }
  };

  // ---- 질문 기록 (구글 시트) ----
  let lastLogged = "", adminMode = false;
  function send(payload){
    if(!state.logUrl) return;
    const body = JSON.stringify(payload);
    try{ if(navigator.sendBeacon && navigator.sendBeacon(state.logUrl, new Blob([body], {type:"text/plain"}))) return; }catch(e){}
    try{ fetch(state.logUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body, keepalive:true}); }catch(e){}
  }
  function logSearch(q){
    q = (q||"").trim();
    if(!q || q === lastLogged || adminMode) return;
    lastLogged = q;
    const top = find(q)[0];
    send({type:"search", q, page: top ? top.e.title : "기타"});
  }
  $("#result").addEventListener("click", ev=>{
    const a = ev.target.closest("a[data-log]"); if(!a || adminMode) return;
    const q = $("#q").value.trim(); logSearch(q);
    send({type: a.dataset.log, q, page: a.dataset.page || ""});
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") logSearch($("#q").value); });

  // ---- 통계 (관리자) ----
  const KEYSTORE = "hr-finder-statskey";
  try{ $("#statsKey").value = localStorage.getItem(KEYSTORE) || ""; }catch(e){}
  $("#saveForms").onclick = ()=>{
    const v = $("#formsUrl").value.trim();
    if(v && !/QUESTION|%7Bq%7D|\{q\}/i.test(v)){ toast("링크 안에 QUESTION이 보이지 않아요. 질문 칸에 QUESTION을 적고 미리 채운 링크를 다시 만들어 주세요"); return; }
    state.formsUrl = v; save(); toast(v ? "문의 양식을 저장했어요" : "문의 양식 버튼을 껐어요");
  };
  $("#testForms").onclick = ()=>{
    const u = state.formsUrl; const box = $("#testFormsOut");
    if(!u){ toast("문의 양식 링크를 먼저 저장해 주세요"); return; }
    const t = formsLink("테스트 질문입니다");
    box.innerHTML = `<a class="btn small" href="${esc(t)}" target="_blank" rel="noopener">질문이 채워진 양식 열기 ↗</a>`;
  };
  $("#saveLog").onclick = ()=>{
    const v = $("#logUrl").value.trim();
    if(v && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){ toast("…/exec로 끝나는 웹 앱 주소를 넣어 주세요"); return; }
    state.logUrl = v; save(); toast(v ? "기록 주소를 저장했어요" : "기록을 껐어요");
  };
  function bars(list, max, cls){
    const top = Math.max(1, ...list.map(x=>x.n));
    return `<ul class="bars ${cls||""}">${list.slice(0,max).map(x=>`<li><span>${esc(x.name)}</span><span class="n">${x.n}건</span><span class="bar"><i style="width:${Math.max(3, x.n/top*100)}%"></i></span></li>`).join("")}</ul>`;
  }
  let lastStats = null;
  $("#loadStats").onclick = async function(){
    const url = state.logUrl, key = $("#statsKey").value.trim(), box = $("#stats");
    if(!url){ toast("기록 주소를 먼저 저장해 주세요"); return; }
    if(!key){ toast("통계 키를 입력해 주세요"); return; }
    try{ localStorage.setItem(KEYSTORE, key); }catch(e){}
    this.disabled = true; this.textContent = "불러오는 중…";
    try{
      const res = await fetch(url + "?key=" + encodeURIComponent(key) + "&days=" + $("#statsDays").value);
      const d = await res.json();
      if(!d.ok){ box.innerHTML = `<p class="hint">${d.error==="key" ? "통계 키가 맞지 않아요. Apps Script의 ADMIN_KEY와 같은지 확인해 주세요." : "통계를 읽지 못했어요."}</p>`; return; }
      lastStats = d;
      const pct = d.total ? Math.round(d.other/d.total*100) : 0;
      box.innerHTML = `
        <div class="tiles">
          <div class="tile"><b>${d.total}</b><span>전체 문의</span></div>
          <div class="tile warn"><b>${d.other}</b><span>기타 (${pct}%)</span></div>
          <div class="tile"><b>${d.siteSearch}</b><span>사이트 검색</span></div>
        </div>
        ${d.pages.length ? `<p class="stat-h">페이지별 문의 건수</p>${bars(d.pages, 12)}` : `<p class="hint">아직 쌓인 기록이 없어요.</p>`}
        ${d.questions.length ? `<p class="stat-h">많이 들어온 질문 <button class="btn small" type="button" id="useTop">TOP 5에 반영</button></p>${bars(d.questions, 10)}` : ""}
        ${d.otherQuestions.length ? `<p class="stat-h">기타 질문 (맞는 페이지를 못 찾은 질문)</p>${bars(d.otherQuestions, 30, "other")}
          <p class="hint">자주 보이는 단어를 바로가기 키워드에 추가하면 '기타'가 줄어들어요.</p>` : ""}`;
      const ut = $("#useTop");
      if(ut) ut.onclick = ()=>{ state.quick = lastStats.questions.slice(0,5).map(x=>x.name); save(); toast("실제 상위 질문으로 TOP 5를 바꿨어요"); };
    }catch(e){
      box.innerHTML = `<p class="hint">연결하지 못했어요. 웹 앱 주소와, 배포 시 액세스 권한이 '모든 사용자'인지 확인해 주세요.</p>`;
    }finally{ this.disabled = false; this.textContent = "통계 불러오기"; }
  };

  // ---- 관리자: #admin 주소 + PIN ----
  const DRAFT = "hr-finder-draft";
  const hash = s => { let h = 2166136261; for(const ch of "hrf:"+s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h>>>0).toString(16); };
  function enterAdmin(){
    adminMode = true;
    $("#tabs").hidden = false; $("#pinCard").hidden = true;
    try{ const d = JSON.parse(localStorage.getItem(DRAFT)||"null"); if(d && Array.isArray(d.entries)){ state = d; dirty = true; renderAll(); toast("저장 안 한 수정 내용을 불러왔어요"); } }catch(e){}
    tab("set");
  }
  $("#pinCard").addEventListener("submit", ev=>{
    ev.preventDefault();
    if(hash($("#pin").value) === (state.pinHash || hash("0000"))){ $("#pin").value=""; enterAdmin(); }
    else { toast("PIN이 맞지 않아요"); $("#pin").select(); }
  });
  function askPin(){ if(adminMode) return; $("#pinCard").hidden = false; $("#pin").focus(); }
  if(location.hash === "#admin") askPin();
  // 주소창에 #admin만 덧붙여도(새로고침 없이) 열리게
  window.addEventListener("hashchange", ()=>{ if(location.hash === "#admin") askPin(); });
  // 숨은 입구: 제목을 2초 안에 5번 누르기
  let taps = 0, tapTimer;
  document.querySelector("h1").addEventListener("click", ()=>{
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(()=>taps=0, 2000);
    if(taps >= 5){ taps = 0; askPin(); }
  });
  const _save = save;
  save = function(){ _save(); try{ localStorage.setItem(DRAFT, JSON.stringify(state)); }catch(e){} };
  $("#saveFaq").onclick = ()=>{
    const lines = $("#faqEdit").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(lines.length>5) toast("5개까지만 보여요. 6번째부터는 빠져요");
    state.quick = lines.slice(0,5); save(); if(lines.length<=5) toast("자주 묻는 질문을 저장했어요");
  };
  $("#savePin").onclick = ()=>{
    const v = $("#newPin").value.trim();
    if(v.length < 4){ toast("PIN은 4자리 이상으로 정해 주세요"); return; }
    state.pinHash = hash(v); $("#newPin").value=""; save(); toast("PIN을 바꿨어요. 배포용 파일에 함께 저장돼요");
  };

  // ---- 배포용 파일 만들기 ----
  const END = '</' + 'script>';
  function buildDoc(){
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
      + '<title>' + document.title + '</title>\n'
      + document.getElementById("fonts").outerHTML + '\n'
      + document.getElementById("qrlib").outerHTML + '\n'
      + '<style id="app-style">' + document.getElementById("app-style").textContent + '</style>\n</head>\n<body>\n'
      + '<div id="mount"></div>\n'
      + document.getElementById("shell").outerHTML + '\n'
      + '<script type="application/json" id="cfg">' + json + END + '\n'
      + '<script id="app">' + document.getElementById("app").textContent + END + '\n</body>\n</html>\n';
  }
  $("#publishBtn").onclick = ()=>{
    const blob = new Blob([buildDoc()], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "hr-finder.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    dirty = false; try{ localStorage.removeItem(DRAFT); }catch(e){} renderAll();
    toast("hr-finder.html을 저장했어요. 서버의 기존 파일과 바꿔 주세요");
  };

  renderAll();
  $("#q").value="연차 몇 개 남았는지"; show($("#q").value);
})();
</script>
</body>
</html>
